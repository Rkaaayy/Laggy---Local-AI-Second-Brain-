services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: local_qdrant
    ports:
      - "127.0.0.1:6333:6333" # Strictly bound to localhost
    volumes:
      - ./qdrant_storage:/qdrant/storage

  redis:
    image: redis:alpine
    container_name: local_redis
    ports:
      - "127.0.0.1:6379:6379" # Strictly bound to localhost

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: local_observability
    ports:
      - "127.0.0.1:6006:6006" # Local tracing UI at http://127.0.0.1:6006